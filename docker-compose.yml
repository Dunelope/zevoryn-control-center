services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zevoryn_control}
      POSTGRES_USER: ${POSTGRES_USER:-zevoryn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["${POSTGRES_PORT:-5442}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zevoryn} -d ${POSTGRES_DB:-zevoryn_control}"], interval: 5s, timeout: 5s, retries: 10 }
  api:
    build: { context: ., dockerfile: backend/Zevoryn.Control.Api/Dockerfile }
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ControlDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-zevoryn_control};Username=${POSTGRES_USER:-zevoryn};Password=${POSTGRES_PASSWORD:-local-development-only}"
      Cors__Origins__0: "http://localhost:${FRONTEND_PORT:-5173}"
      Database__ApplyMigrations: "true"
    ports: ["${API_PORT:-5080}:8080"]
    depends_on: { postgres: { condition: service_healthy } }
  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    environment: { VITE_API_BASE_URL: "http://localhost:${API_PORT:-5080}" }
    ports: ["${FRONTEND_PORT:-5173}:5173"]
    depends_on: [api]
volumes: { postgres-data: {} }
